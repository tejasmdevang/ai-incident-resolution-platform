services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: incident-postgres

    environment:
      POSTGRES_DB: incident_platform
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_password

    ports:
      - "5433:5432"

    volumes:
      - incident_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: incident-backend

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/incident_platform
      DB_USERNAME: incident_user
      DB_PASSWORD: incident_password
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: incident-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend
volumes:
  incident_postgres_data: